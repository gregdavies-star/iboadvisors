# After anything SEO-relevant lands on main: regenerate the derived files (sitemap <lastmod> and
# JSON-LD), commit them back if they changed, wait for Vercel to deploy, then (re)submit the
# sitemap to Search Console so Google fetches the new <lastmod> values and any new URLs promptly.
#
# The regenerate-and-commit step is what keeps <lastmod> honest: any commit that touches a page
# moves its git date, so a pure "is the sitemap current?" check would fail after every merge.
name: SEO on merge

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "robots.txt"
      - "vercel.json"
      - "scripts/**"

permissions:
  contents: write
  id-token: write

jobs:
  verify-and-submit:
    runs-on: ubuntu-latest
    # Secrets are mapped to env here because the `secrets` context cannot be used in a step's `if`.
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate derived files and commit them if they changed
        run: |
          node scripts/build-sitemap.mjs
          node scripts/ensure-jsonld.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            # [skip ci] keeps this push from re-triggering workflows; Vercel still deploys it.
            git commit -m "seo: refresh sitemap lastmod and JSON-LD [skip ci]"
            git push origin HEAD:main
          else
            echo "derived files already current"
          fi

      - name: Wait for the live sitemap to match this commit
        run: |
          for i in $(seq 1 20); do
            if diff <(curl -fsS https://www.iboadvisors.com/sitemap.xml) sitemap.xml >/dev/null 2>&1; then
              echo "live sitemap matches"; exit 0
            fi
            echo "waiting for Vercel deploy ($i)"; sleep 30
          done
          echo "live sitemap still differs after 10 minutes - submitting anyway"

      - name: Authenticate to Google (keyless, Workload Identity Federation)
        id: gauth
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters

      - name: Submit sitemap to Search Console
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || env.GSC_SERVICE_ACCOUNT_JSON != '' }}
        env:
          GSC_ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
        run: node scripts/gsc.mjs submit-sitemap
